<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ranjith">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.52" stop-color="#0c1828"/>
      <stop offset="1" stop-color="#08111b"/>
    </linearGradient>
    <radialGradient id="cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 H0 V28" fill="none" stroke="#e6edf3" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="160" cy="50" r="150" fill="url(#cyan)">
      <animate attributeName="cx" values="120;230;120" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="280" r="170" fill="url(#violet)">
      <animate attributeName="cy" values="300;210;300" dur="18s" repeatCount="indefinite"/>
    </circle>
    <g fill="#f8fafc">
      <circle cx="96" cy="64" r="1.3" opacity="0.35">
        <animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="240" cy="248" r="1.2" opacity="0.3">
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="72" r="1.4" opacity="0.4">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="860" cy="250" r="1.1" opacity="0.25">
        <animate attributeName="opacity" values="0.12;0.85;0.12" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="42" r="1.2" opacity="0.3">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <path d="M44 46 H150 M44 46 V128" fill="none" stroke="#67e8f9" stroke-width="1.4" opacity="0.8"/>
    <path d="M1156 274 H1050 M1156 274 V192" fill="none" stroke="#a5b4fc" stroke-width="1.4" opacity="0.8"/>
    <text x="600" y="118" text-anchor="middle" fill="#67e8f9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="6">SOFTWARE  ·  INSTRUMENTS  ·  TOOLS</text>
    <text x="600" y="196" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="600">Ranjith</text>
    <rect x="455" y="220" width="290" height="2" fill="url(#rule)"/>
    <text x="600" y="258" text-anchor="middle" fill="#9fb0c3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">lab systems, product demos, and developer tools</text>
  </g>
</svg>
