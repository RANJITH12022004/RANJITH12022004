    <path d="M-16 -20 H4 C16 -20 20 -12 20 -4 C20 5 14 10 4 10 H-4 V22 H-16 Z M-4 -8 V0 H3 C8 0 9 -2 9 -4 C9 -6 8 -8 3 -8 Z" fill="url(#orb)"/>
